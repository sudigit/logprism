# Proposed by LogPrism self-heal -- NOT LIVE until a human promotes it.
# cluster: 5e5d8600d243 (key=value {id, sn, time, fw, …}) on channel udp:5514
# generator: Structure inference (air-gapped, deterministic)
# validation: parses 25/25 samples; regression PASSED
source_id: sonicwall_edge
version: v1
log_name: sonicwall_edge
product:
  name: sonicwall_edge
  vendor_name: unknown
channels:
- udp:5514
priority: 55
fingerprint:
  type: contains
  pattern: id=firewall
tokenize:
  type: kv
ocsf:
  class_uid: 4001
  activity: Traffic
mapping:
  fields:
    id: metadata.event_code
    sn: device.uid
    fw: device.hostname
    pri: severity_id
    msg: message
    src_ip: src_endpoint.ip
    src_port: src_endpoint.port
    dst_ip: dst_endpoint.ip
    dst_port: dst_endpoint.port
    proto: connection_info.protocol_name
    fw_action: disposition
  extract:
  - from: src
    pattern: ^(?P<src_ip>(?:\d{1,3}\.){3}\d{1,3})[:/](?P<src_port>\d+)
  - from: dst
    pattern: ^(?P<dst_ip>(?:\d{1,3}\.){3}\d{1,3})[:/](?P<dst_port>\d+)
  values:
    fw_action:
      drop: Dropped
      forward: Allowed
    pri:
      0: 6
      1: 5
      2: 5
      3: 4
      4: 3
      5: 2
      6: 1
      7: 1
  lookups:
  - from: fw_action
    to: activity_name
    map:
      drop: Refuse
      forward: Traffic
    default: Traffic
  timestamp:
    source: time
    format: '%Y-%m-%d %H:%M:%S UTC'
    fallback: envelope
